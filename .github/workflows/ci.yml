name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict C11 build
        run: |
          make clean
          make CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror"

      - name: Test
        run: ./test_fcheck

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ASan and UBSan build
        run: |
          make clean
          make CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: ASan and UBSan tests
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ./test_fcheck
